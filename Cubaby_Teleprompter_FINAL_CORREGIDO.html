<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cubaby Sync Core</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#fff}*{box-sizing:border-box}body{margin:0;padding:0 0 92px}.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid #dbe8f4;padding:10px 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.title{font-weight:800;font-size:15px}.pill{padding:6px 10px;border-radius:999px;background:#edf5ff;font-weight:700;font-size:13px}.ok{background:#e8f8ee}.warn{background:#fff3db}.bad{background:#ffe9e9}.setsel{min-width:280px;max-width:520px;flex:1;padding:8px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#111}.status{font-size:13px;color:#555;margin-top:7px}.lyrics{padding:14px 10px 140px;max-width:1500px;margin:auto}.song-title{font-size:24px;font-weight:800;margin:8px 0 18px}.section{margin:0 0 26px}.section-label{font-size:14px;color:#777;margin:0 0 6px;font-weight:700}.line{font-size:clamp(23px,2.25vw,38px);line-height:1.26;padding:2px 8px;border-left:4px solid transparent}.line.active{font-weight:800;color:#168cf0;background:#eaf5ff;border-left-color:#168cf0}.dock{position:fixed;left:8px;bottom:8px;z-index:30;display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.96);padding:6px;border:1px solid #ddd;border-radius:12px;box-shadow:0 6px 25px #0002}.btn{border:1px solid #bbb;background:#fff;color:#111;padding:9px 14px;border-radius:8px;font-weight:800}.btn.play{background:#2998ff;color:#fff;border-color:#2998ff}.btn.pause{background:#cc4450;color:#fff;border-color:#cc4450}.diag{position:fixed;right:8px;bottom:8px;background:#111;color:#fff;border-radius:8px;padding:7px 10px;font:12px ui-monospace,monospace;opacity:.88;z-index:31;max-width:45vw;white-space:pre-wrap}.hidden{display:none}@media(max-width:700px){.line{font-size:25px}.diag{max-width:70vw}.setsel{min-width:180px}}
</style></head><body><div class="bar"><div class="row"><span class="title">CUBABY · SYNC CORE</span><span id="state" class="pill">IDLE</span><span id="pos" class="pill">POS 0:00</span><span id="score" class="pill">AUDIO —</span><span id="setpos" class="pill ok">SET 1/21</span></div><div class="row" style="margin-top:8px"><select id="setSelect" class="setsel"></select><span id="next" class="pill">Siguiente: —</span></div><div id="status" class="status">PLAY activa el micrófono. SET sólo limita la búsqueda a actual → siguiente.</div></div><main id="lyrics" class="lyrics"></main><div class="dock"><button id="play" class="btn play">▶ PLAY</button><button id="reset" class="btn">↺ RESET</button><button id="prevLine" class="btn">◀ 1 LÍNEA</button><button id="nextLine" class="btn">1 LÍNEA ▶</button><button id="find" class="btn">⌖ BUSCAR</button><button id="diagBtn" class="btn">DIAG</button></div><div id="diag" class="diag hidden"></div><script src="core/data.js"></script><script src="core/sync-core.js"></script></body></html>
