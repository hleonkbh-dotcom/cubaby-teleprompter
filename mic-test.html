<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cubaby · Prueba de micrófono</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#0b1220;color:#fff;display:grid;min-height:100vh;place-items:center}.card{width:min(92vw,520px);background:#151d2d;border:1px solid #2b3850;border-radius:24px;padding:28px;box-sizing:border-box}.k{color:#4aa8ff;font-weight:800;letter-spacing:.12em}.status{margin-top:18px;padding:14px;border-radius:14px;background:#202a3d}.ok{background:#123b2a}.warn{background:#4a2b17}button{width:100%;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:800;margin-top:18px}small{color:#a9b4c8}.meter{height:12px;background:#283247;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#4aa8ff}</style></head><body><main class="card"><div class="k">CUBABY · SYNC VIVO</div><h1>Prueba de micrófono</h1><p>Esta página sirve para verificar que el entorno HTTPS/app permite escuchar a la banda.</p><p><small id="env"></small></p><button id="go">Probar micrófono</button><div id="status" class="status">Sin probar.</div><div class="meter"><div id="bar" class="bar"></div></div></main><script>const st=document.getElementById('status'),bar=document.getElementById('bar'),env=document.getElementById('env');env.textContent=`Protocolo: ${location.protocol} · contexto seguro: ${window.isSecureContext?'sí':'no'}`;document.getElementById('go').onclick=async()=>{if(location.protocol==='content:'||location.protocol==='file:'){st.className='status warn';st.textContent='Archivo local detectado. Esta prueba debe abrirse por HTTPS/PWA o desde la app instalada.';return}if(!window.isSecureContext){st.className='status warn';st.textContent='No es un contexto seguro. Usa HTTPS.';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});st.className='status ok';st.textContent='Micrófono autorizado. Habla o toca: el medidor debe moverse.';const ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=1024;src.connect(an);const data=new Uint8Array(an.fftSize);function tick(){an.getByteTimeDomainData(data);let sum=0;for(const v of data){const x=(v-128)/128;sum+=x*x}const rms=Math.sqrt(sum/data.length);bar.style.width=Math.min(100,rms*450)+'%';requestAnimationFrame(tick)}tick()}catch(e){st.className='status warn';st.textContent=`No disponible (${e?.name||'error'}). Revisa el permiso de micrófono del navegador/app.`}};</script></body></html>
